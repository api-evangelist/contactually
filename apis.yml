name: Contactually
description: >-
  Contactually was a cloud-based CRM (customer relationship management) platform focused on helping
  real estate agents, brokers, and other relationship-driven professionals nurture their networks
  through follow-up reminders, contact bucketing, pipelines, and automated outreach. Founded around
  2011, it was acquired by real estate brokerage Compass on February 27, 2019, and had already been
  powering Compass's own CRM. Contactually permanently ceased operations on March 31, 2022. It
  historically exposed a v2 REST API (api.contactually.com) documented at developers.contactually.com
  for contacts, buckets, notes, tasks, and webhooks, but that developer surface, the API hosts, and
  all SDKs are now offline. This API Evangelist profile is retained as a historical record of a
  defunct provider; no live API, documentation, SDK, or event surface remains to enrich.
